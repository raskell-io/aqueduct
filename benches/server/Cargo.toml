[package]
name = "aqueduct-bench-server"
description = "End-to-end single-server benchmark: a load generator against a real listener"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aqueduct-core.workspace = true
aqueduct-engine.workspace = true
aqueduct-procedure.workspace = true
aqueduct-protocol.workspace = true
aqueduct-sdk.workspace = true
aqueduct-server.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util"] }
tokio-stream = { version = "0.1", default-features = false }
tonic = { version = "0.14", default-features = false, features = ["codegen", "channel"] }
