[package]
name = "aqueduct-conformance"
description = "Aqueduct's conformance suite for step workers: scenarios every worker library must pass"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aqueduct-core.workspace = true
aqueduct-engine.workspace = true
