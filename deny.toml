# cargo-deny configuration. See BRIEF.md, section 13, for the license policy.

[graph]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained (not vulnerable) crates that come in through `starlark`, accepted by the owner on
# 2026-10-31 (ADR 0008). Revisit when upgrading starlark. Vulnerability advisories are never ignored.
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill, unmaintained, via starlark -> pagable -> postcard -> heapless" },
    { id = "RUSTSEC-2024-0388", reason = "derivative, unmaintained, via starlark" },
    { id = "RUSTSEC-2024-0436", reason = "paste, unmaintained, via starlark" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash, unmaintained, via starlark_map" },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# BSL-1.0 is the Boost Software License (permissive, OSI-approved), not the Business Source License.
# Allowed only for these Windows-only crates that starlark pulls in through rustyline, accepted by the
# owner on 2026-10-31 (ADR 0008).
[[licenses.exceptions]]
crate = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
crate = "error-code"
allow = ["BSL-1.0"]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
