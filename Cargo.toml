[workspace]
resolver = "3"
members = ["crates/*", "benches/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/raskell-io/aqueduct"
homepage = "https://github.com/raskell-io/aqueduct"
authors = ["Raskell <hello@raskell.io>"]
publish = false

[workspace.dependencies]
aqueduct-core = { path = "crates/aqueduct-core" }
aqueduct-engine = { path = "crates/aqueduct-engine" }
aqueduct-codec = { path = "crates/aqueduct-codec" }
aqueduct-procedure = { path = "crates/aqueduct-procedure" }
aqueduct-storage = { path = "crates/aqueduct-storage" }
aqueduct-sim = { path = "crates/aqueduct-sim" }
aqueduct-sdk = { path = "crates/aqueduct-sdk" }
crc32fast = "1"
proptest = "1"
sha2 = "0.10"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
