[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/raskell-io/aqueduct"
homepage = "https://github.com/raskell-io/aqueduct"
authors = ["Raskell <hello@raskell.io>"]
publish = false

[workspace.dependencies]
aqueduct-core = { path = "crates/aqueduct-core" }
aqueduct-codec = { path = "crates/aqueduct-codec" }
aqueduct-storage = { path = "crates/aqueduct-storage" }
aqueduct-sim = { path = "crates/aqueduct-sim" }
aqueduct-sdk = { path = "crates/aqueduct-sdk" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
