name: CLA

# Runs with the base repository's workflow and token (pull_request_target), so it works for pull
# requests from forks. It never checks out or runs code from the pull request: the only step is the
# script in .github/cla/check.js from the default branch, which calls the GitHub API.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: cla-signatures
  cancel-in-progress: false

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, 'I hereby sign it'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/cla
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const check = require('./.github/cla/check.js');
            await check({ github, context });
