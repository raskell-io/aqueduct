[package]
name = "aqueduct"
description = "Aqueduct: a deterministic engine for procedures that agents write and people approve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aqueduct-sdk.workspace = true
aqueduct-core.workspace = true
aqueduct-engine.workspace = true
aqueduct-procedure = { workspace = true, optional = true }
aqueduct-registry = { workspace = true, optional = true }
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }

[features]
default = ["procedures"]
# Starlark procedures and the version registry. Without them, about 75 crates instead of about 200.
procedures = ["dep:aqueduct-procedure", "dep:aqueduct-registry"]
# AsyncEngine: the embedded engine from async code on Tokio.
tokio = ["dep:tokio"]

[dev-dependencies]
aqueduct-cli.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "crystallise"
required-features = ["procedures"]

[[example]]
name = "bounded_agent"
required-features = ["procedures"]
