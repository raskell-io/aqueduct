[package]
name = "aqueduct-server"
description = "The Aqueduct server: the engine behind gRPC and HTTP/JSON (protocol v1, draft)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aqueduct-core.workspace = true
aqueduct-engine.workspace = true
aqueduct-protocol.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server", "channel"] }

[dev-dependencies]
aqueduct-procedure.workspace = true
